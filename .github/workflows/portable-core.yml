name: Portable Core v1

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      source-directory:
        type: string
        default: "."
      dotnet-project:
        type: string
        default: ""
      dotnet-mode:
        type: string
        default: test
      dotnet-version:
        type: string
        default: "10.0.x"
      java-version:
        type: string
        default: "21"
      gradle-directory:
        type: string
        default: "."
      python-test-patterns:
        type: string
        default: ""
      python-scripts:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert checkout is exact event SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-dotnet@v4
        if: inputs.language == 'dotnet'
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - uses: actions/setup-java@v4
        if: inputs.language == 'gradle'
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Build and test portable C++
        if: inputs.language == 'cmake'
        shell: bash
        env:
          SOURCE_DIR: ${{ inputs.source-directory }}
        run: |
          set -euo pipefail
          case "$SOURCE_DIR" in /*|../*|*/../*|*/..) exit 2;; esac
          cmake -S "$SOURCE_DIR" -B "$RUNNER_TEMP/portable-cpp" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/portable-cpp" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/portable-cpp" -C Release --output-on-failure --no-tests=error
      - name: Build and test portable .NET
        if: inputs.language == 'dotnet'
        shell: bash
        env:
          PROJECT: ${{ inputs.dotnet-project }}
          MODE: ${{ inputs.dotnet-mode }}
        run: |
          set -euo pipefail
          case "$PROJECT" in /*|../*|*/../*|*/..|*.sln) exit 2;; esac
          test -f "$PROJECT"
          case "$PROJECT" in *.csproj) ;; *) exit 2;; esac
          dotnet restore "$PROJECT"
          case "$MODE" in
            test) dotnet test "$PROJECT" -c Release --no-restore --verbosity normal ;;
            selftest) dotnet run --project "$PROJECT" -c Release --no-restore ;;
            *) exit 2 ;;
          esac
      - name: Test portable Gradle JVM project
        if: inputs.language == 'gradle'
        shell: bash
        env:
          PROJECT_DIR: ${{ inputs.gradle-directory }}
        run: |
          set -euo pipefail
          case "$PROJECT_DIR" in /*|../*|*/../*|*/..) exit 2;; esac
          test -f "$PROJECT_DIR/gradlew"
          bash "$PROJECT_DIR/gradlew" --no-daemon --project-dir "$PROJECT_DIR" test
      - name: Python unittest fixtures
        if: inputs.python-test-patterns != ''
        shell: bash
        env:
          PATTERNS: ${{ inputs.python-test-patterns }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a patterns <<< "$PATTERNS"
          for pattern in "${patterns[@]}"; do
            test -n "$pattern"
            case "$pattern" in */*|*..*) exit 2;; esac
            python3 -m unittest discover -s tests -p "$pattern" -v
          done
      - name: Python scripts
        if: inputs.python-scripts != ''
        shell: bash
        env:
          SCRIPTS: ${{ inputs.python-scripts }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a scripts <<< "$SCRIPTS"
          for script in "${scripts[@]}"; do
            case "$script" in /*|../*|*/../*|*/..|*\\*) exit 2;; *.py) ;; *) exit 2;; esac
            test -f "$script"
            python3 "$script"
          done
      - name: Source SHA and result
        if: always()
        shell: bash
        env:
          LANGUAGE: ${{ inputs.language }}
          STATUS: ${{ job.status }}
        run: |
          echo "### Portable Core v1" >> "$GITHUB_STEP_SUMMARY"
          echo "Caller: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Language: $LANGUAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: $STATUS (headless only)" >> "$GITHUB_STEP_SUMMARY"
