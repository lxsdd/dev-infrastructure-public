name: Discogger protected GUI workflow policy (no secrets)

on:
  pull_request:
    paths:
      - '.github/workflows/discogs-authenticated-native-gui.yml'
      - '.github/workflows/discogs-authenticated-native-gui-policy.yml'

permissions:
  contents: read

jobs:
  policy-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce protected main-only credential path and no uploads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/discogs-authenticated-native-gui.yml').read_text()
          trigger = src.split('jobs:', 1)[0]
          assert '  pull_request:' not in trigger
          assert "environment: discogs-live-qa" in src
          assert "github.repository == 'lxsdd/dev-infrastructure-public'" in src
          assert "github.ref == 'refs/heads/main'" in src
          assert "github.event_name == 'push'" in src
          assert "uses: actions/upload-artifact" not in src
          assert "pull_request_target:" not in src
          assert "DISCOGS_OAUTH_CONSUMER_SECRET:" in src
          assert "DISCOGS_OAUTH_TOKEN_SECRET:" in src
          assert "238e35fdf691170babc87083992ed3e3b0a5008d" in src
          assert "a027ef885c803a1b1216c62c8a4d6190a19cd833" in src
          assert src.count("secrets.DISCOGS_OAUTH_CONSUMER_KEY") == 2
          assert src.count("secrets.DISCOGS_OAUTH_CONSUMER_SECRET") == 2
          assert src.count("secrets.DISCOGS_OAUTH_ACCESS_TOKEN") == 2
          assert src.count("secrets.DISCOGS_OAUTH_TOKEN_SECRET") == 2
          print('PROTECTED_DISCOGGER_NATIVE_GUI_POLICY=PASS')
          PY
