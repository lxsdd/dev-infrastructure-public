name: foobar2000 2.x isolated host smoke
description: "Runs a verified official x86/x64 foobar host and optionally checks a locally built component was actually loaded."
inputs:
  architecture:
    required: true
    description: "Win32 or x64"
  component-dll:
    required: false
    description: "Existing same-job DLL; blank performs only HOST_BOOT"
    default: ""
  context-command:
    required: false
    description: Optional synthetic WAV native context command
    default: ""
  expected-window-title:
    required: false
    description: Exact native workspace title
    default: ""
  required-control-ids:
    required: false
    description: Comma-separated native control IDs
    default: ""
  installer-mirror-url:
    required: false
    description: Optional exact SHA256-pinned unmodified upstream .exe GitHub Release URL, not yet published
    default: ""
runs:
  using: composite
  steps:
    - name: Verify foobar2000 boot and component module loading
      shell: pwsh
      env:
        FB2K_ACTION_ROOT: ${{ github.action_path }}
        FB2K_ARCH: ${{ inputs.architecture }}
        FB2K_COMPONENT: ${{ inputs.component-dll }}
        FB2K_CONTEXT_COMMAND: ${{ inputs.context-command }}
        FB2K_EXPECTED_WINDOW_TITLE: ${{ inputs.expected-window-title }}
        FB2K_REQUIRED_CONTROLS: ${{ inputs.required-control-ids }}
        FB2K_INSTALLER_MIRROR: ${{ inputs.installer-mirror-url }}
      run: |
        & (Join-Path $env:FB2K_ACTION_ROOT 'host-smoke.ps1') -Architecture $env:FB2K_ARCH -ComponentDll $env:FB2K_COMPONENT -ContextCommand $env:FB2K_CONTEXT_COMMAND -ExpectedWindowTitle $env:FB2K_EXPECTED_WINDOW_TITLE -RequiredControlIds $env:FB2K_REQUIRED_CONTROLS -InstallerMirrorUrl $env:FB2K_INSTALLER_MIRROR
