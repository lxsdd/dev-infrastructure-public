name: foobar2000 2.x isolated host smoke
description: "Runs a verified official x86/x64 foobar host and optionally checks a locally built component was actually loaded."
inputs:
  architecture:
    required: true
    description: "Win32 or x64"
  component-dll:
    required: false
    description: "Existing same-job DLL; blank performs only HOST_BOOT"
    default: ""
  context-command:
    required: false
    description: "Optional explicitly no-tag-writes context command for disposable fixtures"
    default: ""
  expected-window-title:
    required: false
    description: "Expected diagnostic window title substring"
    default: ""
runs:
  using: composite
  steps:
    - name: Verify foobar2000 boot and component module loading
      shell: pwsh
      env:
        FB2K_ACTION_ROOT: ${{ github.action_path }}
        FB2K_ARCH: ${{ inputs.architecture }}
        FB2K_COMPONENT: ${{ inputs.component-dll }}
        FB2K_CONTEXT_COMMAND: ${{ inputs.context-command }}
        FB2K_CONTEXT_TITLE: ${{ inputs.expected-window-title }}
      run: |
        & (Join-Path $env:FB2K_ACTION_ROOT 'host-smoke.ps1') -Architecture $env:FB2K_ARCH -ComponentDll $env:FB2K_COMPONENT -ContextCommand $env:FB2K_CONTEXT_COMMAND -ExpectedWindowTitle $env:FB2K_CONTEXT_TITLE
