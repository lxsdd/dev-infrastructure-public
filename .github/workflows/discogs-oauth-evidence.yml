name: Discogs central OAuth live evidence (no secrets)

# Reusable from public/private source repos; never accepts or exports tokens,
# never checks out callers' untrusted code, and never requests environment.
on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/discogs-oauth-evidence.yml'
      - '.github/workflows/discogs-oauth-live-qa.yml'

permissions:
  contents: read

jobs:
  central-evidence:
    name: Verify recent central Discogs OAuth QA result
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify only public GitHub Actions status (no credentials)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta
          repo = "lxsdd/dev-infrastructure-public"
          expected_path = ".github/workflows/discogs-oauth-live-qa.yml"
          url = "https://api.github.com/repos/" + repo + "/actions/runs?per_page=100"
          now = datetime.now(timezone.utc)
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "User-Agent": "DiscogsCentralQA-Evidence/1.0",
          })
          try:
              with urllib.request.urlopen(req, timeout=18) as response:
                  payload = json.load(response)
          except (urllib.error.URLError, ValueError, TimeoutError):
              raise SystemExit("CENTRAL_DISCOGS_EVIDENCE=UNAVAILABLE")
          candidates = []
          for run in payload.get("workflow_runs", []):
              if (run.get("path") != expected_path or
                  run.get("head_branch") != "main" or
                  run.get("event") not in ("schedule", "workflow_dispatch") or
                  run.get("status") != "completed"):
                  continue
              try:
                  created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              except (TypeError, KeyError, ValueError):
                  continue
              if timedelta(0) <= now-created <= timedelta(hours=72):
                  candidates.append((created, run))
          if not candidates:
              raise SystemExit("CENTRAL_DISCOGS_EVIDENCE=STALE_OR_MISSING")
          newest = max(candidates, key=lambda x: x[0])[1]
          if newest.get("conclusion") != "success":
              raise SystemExit("CENTRAL_DISCOGS_EVIDENCE=LATEST_RUN_NOT_SUCCESS")
          print("CENTRAL_DISCOGS_OAUTH_LIVE_EVIDENCE=PASS")
          print("CENTRAL_DISCOGS_OAUTH_LIVE_RUN=" + str(int(newest["id"])))
          # Central API evidence is NOT native Discogger/foobar GUI QA.
          PY
