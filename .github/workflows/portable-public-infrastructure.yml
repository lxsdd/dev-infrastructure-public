name: Free public shared infrastructure Windows contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portable-public-infrastructure.yml'
      - 'tests/check_foobar_verifier.ps1'
      - 'contracts/shared-source-registry.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/portable-public-infrastructure.yml'
      - 'tests/check_foobar_verifier.ps1'
      - 'contracts/shared-source-registry.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-public-infra-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  public-windows-contract:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Checkout source-only public regression fixtures
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable public verifier owner
        uses: actions/checkout@v4
        with:
          repository: lxsdd/foobar2000_component_template
          ref: dc623b26feda0f78b7d41a6922d216af4943db01
          path: _public_template
          persist-credentials: false
      - name: Check exact public source blob and PowerShell parser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git -C _public_template rev-parse 'HEAD:ci/verify-fb2k-component.ps1').Trim()
          if ($LASTEXITCODE -ne 0 -or $source -ne '26fe194bdc429337a8ddc06e2e14ff6a9f03840d') {
            throw ('Canonical public verifier source differs: ' + $source)
          }
          $files = @((Get-ChildItem scripts,tests -Filter '*.ps1' -File -Recurse) |
            Select-Object -ExpandProperty FullName)
          $files += (Resolve-Path '_public_template/ci/verify-fb2k-component.ps1').Path
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ('PowerShell parser errors in ' + $file + ': ' + $errors.Count) }
            Write-Host ('PASS parser: ' + $file)
          }
      - name: Synthetic Win32 and x64 package acceptance and rejection (PowerShell 7)
        shell: pwsh
        run: ./tests/check_foobar_verifier.ps1 -VerifierPath _public_template/ci/verify-fb2k-component.ps1
      - name: Repeat exact verifier regressions with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/check_foobar_verifier.ps1 -VerifierPath _public_template/ci/verify-fb2k-component.ps1
