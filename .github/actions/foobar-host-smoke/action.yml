name: foobar2000 2.x isolated host smoke
description: "Runs a verified official x86/x64 foobar host and optionally checks a locally built component was actually loaded."
inputs:
  architecture:
    required: true
    description: "Win32 or x64"
  component-dll:
    required: false
    description: "Existing same-job DLL; blank performs only HOST_BOOT"
    default: ""
  context-command:
    required: false
    description: Optional synthetic WAV native context command
    default: ""
  expected-window-title:
    required: false
    description: Exact native workspace title
    default: ""
  required-control-ids:
    required: false
    description: Comma-separated native control IDs
    default: ""
  offline-clipboard-test:
    required: false
    description: Opt-in bounded synthetic manual candidate for a real read-only Win32 dialog
    default: ""
  clipboard-button-id:
    required: false
    description: Native ID of existing user-initiated Import clipboard control
    default: "0"
  clipboard-list-id:
    required: false
    description: Native ID of existing read-only candidate field ListView
    default: "0"
  beatport-edition-host-probe:
    required: false
    description: "Opt-in offline synthetic complete Beatport JSON edition with two distinct mixes"
    default: "false"
  stale-physical-host-probe:
    required: false
    description: "Opt-in synthetic WAV mutation after no-write verification; require stale UI lockdown"
    default: "false"
  authorized-discogs-probe:
    required: false
    description: "Only for separately approved manual workflow_dispatch; secret arrives solely via FB2K_DISCOGS_QA_TOKEN step environment"
    default: "false"
  discogs-release-id:
    required: false
    description: "Single allowlisted public release ID; never a URL or credential"
    default: "38012673"
  external-cue-host-probe:
    required: false
    description: "Opt-in disposable WAV plus external text CUE; run real native Inspect CUE and offline edition compare"
    default: "false"
  embedded-cue-host-probe:
    required: false
    description: "Opt-in deterministic physical FLAC containing an embedded multiline textual CUESHEET; real native Inspect CUE"
    default: "false"
  multi-file-cue-host-probe:
    required: false
    description: "Opt-in distinct disposable WAV FILE references with sequential TRACK 01/02: inspect real native CUE, edition compare, no-write assertions"
    default: "false"
  raw-target-host-probe:
    required: false
    description: "Opt-in real File locations tab, native raw target inspection and read-only user feedback using synthetic WAV"
    default: "false"
runs:
  using: composite
  steps:
    - name: Verify foobar2000 boot and component module loading
      shell: pwsh
      env:
        FB2K_ACTION_ROOT: ${{ github.action_path }}
        FB2K_ARCH: ${{ inputs.architecture }}
        FB2K_COMPONENT: ${{ inputs.component-dll }}
        FB2K_CONTEXT_COMMAND: ${{ inputs.context-command }}
        FB2K_EXPECTED_WINDOW_TITLE: ${{ inputs.expected-window-title }}
        FB2K_REQUIRED_CONTROLS: ${{ inputs.required-control-ids }}
        FB2K_OFFLINE_CLIPBOARD_TEST: ${{ inputs.offline-clipboard-test }}
        FB2K_CLIPBOARD_BUTTON_ID: ${{ inputs.clipboard-button-id }}
        FB2K_CLIPBOARD_LIST_ID: ${{ inputs.clipboard-list-id }}
        FB2K_BEATPORT_EDITION_PROBE: ${{ inputs.beatport-edition-host-probe }}
        FB2K_EXTERNAL_CUE_PROBE: ${{ inputs.external-cue-host-probe }}
        FB2K_EMBEDDED_CUE_PROBE: ${{ inputs.embedded-cue-host-probe }}
        FB2K_MULTI_FILE_CUE_PROBE: ${{ inputs.multi-file-cue-host-probe }}
        FB2K_RAW_TARGET_PROBE: ${{ inputs.raw-target-host-probe }}
        FB2K_STALE_PHYSICAL_PROBE: ${{ inputs.stale-physical-host-probe }}
        FB2K_AUTHORIZED_DISCOGS_PROBE: ${{ inputs.authorized-discogs-probe }}
        FB2K_DISCOGS_RELEASE_ID: ${{ inputs.discogs-release-id }}
      run: |
        & (Join-Path $env:FB2K_ACTION_ROOT 'host-smoke.ps1') -Architecture $env:FB2K_ARCH -ComponentDll $env:FB2K_COMPONENT -ContextCommand $env:FB2K_CONTEXT_COMMAND -ExpectedWindowTitle $env:FB2K_EXPECTED_WINDOW_TITLE -RequiredControlIds $env:FB2K_REQUIRED_CONTROLS -OfflineClipboardTest $env:FB2K_OFFLINE_CLIPBOARD_TEST -ClipboardButtonId ([int]$env:FB2K_CLIPBOARD_BUTTON_ID) -ClipboardListId ([int]$env:FB2K_CLIPBOARD_LIST_ID) -BeatportEditionProbe ($env:FB2K_BEATPORT_EDITION_PROBE -eq 'true') -ExternalCueProbe ($env:FB2K_EXTERNAL_CUE_PROBE -eq 'true') -EmbeddedCueProbe ($env:FB2K_EMBEDDED_CUE_PROBE -eq 'true') -MultiFileCueProbe ($env:FB2K_MULTI_FILE_CUE_PROBE -eq 'true') -RawTargetProbe ($env:FB2K_RAW_TARGET_PROBE -eq 'true') -StalePhysicalProbe ($env:FB2K_STALE_PHYSICAL_PROBE -eq 'true') -AuthorizedDiscogsProbe ($env:FB2K_AUTHORIZED_DISCOGS_PROBE -eq 'true') -DiscogsReleaseId $env:FB2K_DISCOGS_RELEASE_ID
